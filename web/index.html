<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RatIssues</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <div id="app" class="h-screen flex overflow-hidden">
    <!-- сайдбар -->
    <aside id="sidebar" class="hidden md:flex w-64 flex-col border-r border-zinc-800 bg-zinc-950">
      <div class="p-4 border-b border-zinc-800">
        <div class="flex items-center justify-between">
          <h1 class="text-lg font-semibold tracking-tight">RatIssues</h1>
          <button id="new-issue-btn" class="text-xs px-2 py-1 rounded border border-zinc-700 text-zinc-300 hover:border-zinc-500 hover:text-zinc-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-500" title="Новая задача (n)" aria-label="Новая задача (n)">
            + задача
          </button>
        </div>
        <input id="project-search" type="search" placeholder="проекты..." class="mt-3 w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600 focus-visible:ring-2 focus-visible:ring-sky-500" title="Фильтр проектов">
      </div>
      <nav id="project-list" class="flex-1 overflow-y-auto p-2 space-y-1" aria-label="Проекты"></nav>
      <div id="mini-stats" class="p-3 border-t border-zinc-800 text-xs text-zinc-400"></div>
    </aside>

    <!-- мобильный drawer -->
    <div id="drawer-overlay" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden"></div>
    <aside id="drawer" class="fixed left-0 top-0 bottom-0 w-64 bg-zinc-950 border-r border-zinc-800 z-50 transform -translate-x-full transition-transform md:hidden">
      <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
        <h1 class="text-lg font-semibold">RatIssues</h1>
        <button id="drawer-close" class="text-zinc-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 rounded" aria-label="Закрыть меню проектов">✕</button>
      </div>
      <div class="p-3">
        <input id="drawer-project-search" type="search" placeholder="проекты..." class="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600 focus-visible:ring-2 focus-visible:ring-sky-500" title="Фильтр проектов">
      </div>
      <nav id="drawer-project-list" class="p-2 space-y-1 overflow-y-auto" style="max-height: calc(100vh - 180px);"></nav>
      <div id="drawer-mini-stats" class="p-3 border-t border-zinc-800 text-xs text-zinc-400"></div>
    </aside>

    <!-- основная область -->
    <main class="flex-1 flex flex-col min-w-0 bg-zinc-950">
      <!-- верхняя панель -->
      <header class="flex items-center gap-3 p-3 border-b border-zinc-800 bg-zinc-900/50">
        <button id="menu-toggle" class="md:hidden text-zinc-400 p-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 rounded" aria-label="Открыть меню проектов" aria-expanded="false" aria-controls="drawer">☰</button>
        <div id="global-search-wrap" class="flex-1 relative">
          <span class="absolute left-2 top-1/2 -translate-y-1/2 text-zinc-500" aria-hidden="true">/</span>
          <input id="search" type="search" placeholder="поиск задач..." class="w-full bg-zinc-900 border border-zinc-800 rounded pl-7 pr-2 py-1.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600 focus-visible:ring-2 focus-visible:ring-sky-500" title="Поиск задач (/)" aria-label="Поиск задач, нажмите / для фокуса">
        </div>
        <a href="#/log" id="log-link" class="text-sm text-zinc-400 hover:text-zinc-200 whitespace-nowrap focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 rounded" title="Лента событий">Лента</a>
      </header>

      <!-- фильтры -->
      <div id="filters" class="flex flex-wrap items-center gap-2 px-3 py-2 border-b border-zinc-800">
        <div id="status-chips" class="flex flex-wrap gap-2"></div>
        <div class="flex items-center gap-2 ml-auto">
          <input id="label-filter" type="search" placeholder="метка" class="w-28 bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600 focus-visible:ring-2 focus-visible:ring-sky-500" title="Фильтр по метке" aria-label="Фильтр по метке">
          <select id="sort" class="bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600 focus-visible:ring-2 focus-visible:ring-sky-500" title="Сортировка" aria-label="Сортировка">
            <option value="pri">приоритет</option>
            <option value="updated">обновлено</option>
          </select>
        </div>
      </div>

      <!-- контент -->
      <div id="content" class="flex-1 overflow-y-auto p-3">
        <div id="empty" class="hidden text-zinc-500 text-sm text-center mt-10">Нет данных</div>
        <div id="loading" class="text-zinc-500 text-sm text-center mt-10">Загрузка…</div>
        <div id="issue-list" class="hidden space-y-2"></div>
        <div id="issue-detail" class="hidden max-w-3xl mx-auto"></div>
        <div id="log-view" class="hidden max-w-3xl mx-auto"></div>
      </div>
    </main>
  </div>

  <!-- Модалка новой задачи (M5) -->
  <div id="new-issue-modal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="new-issue-overlay" class="absolute inset-0 bg-black/60"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="relative bg-zinc-900 border border-zinc-800 rounded-lg w-full max-w-lg max-h-[90vh] overflow-y-auto p-4">
        <h3 id="modal-title" class="text-lg font-semibold mb-4 text-zinc-100">Новая задача</h3>
        <div id="modal-error" class="hidden text-sm text-rose-400 mb-3"></div>
        <form id="new-issue-form" class="space-y-3">
          <div>
            <label for="new-project" class="block text-xs text-zinc-400 mb-1">Проект</label>
            <select id="new-project" name="project" class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600"></select>
          </div>
          <div>
            <label for="new-title" class="block text-xs text-zinc-400 mb-1">Заголовок</label>
            <input id="new-title" name="title" type="text" required class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600">
          </div>
          <div>
            <label for="new-body" class="block text-xs text-zinc-400 mb-1">Описание</label>
            <textarea id="new-body" name="body" rows="4" class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600"></textarea>
          </div>
          <div>
            <label for="new-priority" class="block text-xs text-zinc-400 mb-1">Приоритет</label>
            <select id="new-priority" name="priority" class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600">
              <option value="0">p0 · срочно</option>
              <option value="1">p1 · высокий</option>
              <option value="2" selected>p2 · обычный</option>
              <option value="3">p3 · когда-нибудь</option>
            </select>
          </div>
          <div>
            <label for="new-labels" class="block text-xs text-zinc-400 mb-1">Метки (через запятую)</label>
            <input id="new-labels" name="labels" type="text" class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600">
          </div>
          <div>
            <label for="new-ref" class="block text-xs text-zinc-400 mb-1">Ref</label>
            <input id="new-ref" name="ref" type="text" class="w-full bg-zinc-950 border border-zinc-800 rounded px-2 py-1.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600">
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="new-cancel" class="px-3 py-1.5 rounded text-sm border border-zinc-700 text-zinc-300 hover:bg-zinc-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-500">Отмена</button>
            <button type="submit" class="px-3 py-1.5 rounded text-sm bg-zinc-100 text-zinc-900 hover:bg-zinc-200 font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-500">Создать</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
